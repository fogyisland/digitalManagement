openapi: 3.0.3

info:
  title: 数字资产管理系统 · API
  version: 1.0.0
  description: |
    这个实例的 HTTP 接口一览。

    **单端口**：API、前端、静态文件、签名文件路由和 MCP 端点都在同一个端口上，
    下面的路径都相对于它。

    **两扇门**：租户里的账号走 `POST /api/v1/auth/login`，平台管理员走
    `POST /api/v1/auth/platform-login`。两扇门互不通用——租户门对平台管理员返
    403，平台门对租户账号返 403。

    **租户作用域**：一个会话令牌只属于一个租户。要操作别的租户的数据，请求
    必须带 `X-Tenant` 头；不写就写进这个令牌自己的租户。平台层的管理员可以
    切换租户，但**写操作必须落到一个具体的租户**——不选就返 400。

    **文件链接是签名的**：`/storage/...` 上的 URL 带有效期和 HMAC 签名，签名
    覆盖文件所属的租户，所以它只打开签发时的那一个文件。链接在平台设置了
    「访问域名」之后是绝对地址，复制到别处也能用。
  license:
    name: Proprietary

servers:
  - url: /
    description: 这个实例自己

tags:
  - name: 认证
    description: 两扇门、会话与密码
  - name: 资产
    description: 上传、查询、修改与三种删除状态
  - name: 分类与标签
    description: 资产的归类
  - name: 账号与密钥
    description: 租户里的账号、API Key 与 MCP 令牌
  - name: 集成
    description: Webhook 与导入
  - name: 平台层
    description: 租户之上那一层：租户、账号目录、审计、流量与设置
  - name: 外部接入
    description: 给外部系统用的接口：投递、接入与 MCP
  - name: 系统
    description: 统计、清单与实例设置
  - name: 首装向导
    description: 第一次安装时用的接口，装完即关闭
  - name: 探针
    description: 健康检查
  - name: 文件
    description: 带签名的文件读取

paths:
  # ---------------------------------------------------------------- 探针 ----
  /api/health:
    get:
      tags: [探针]
      summary: 存活探针
      description: 实例在跑就答 200。它不碰数据库，所以它答 200 不代表数据库可达。
      responses:
        '200':
          description: 实例活着
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: dam }

  /api/health/ready:
    get:
      tags: [探针]
      summary: 就绪探针
      description: 它真的问一次数据库。答 503 就说明这个实例还没准备好。
      responses:
        '200':
          description: 准备好了
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ready }
                  db: { type: string, example: ok }
        '503':
          description: 数据库还连不上
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: not-ready }
                  db: { type: string, example: error }
                  detail: { type: string }

  # ------------------------------------------------------------ 首装向导 ----
  /api/init/status:
    get:
      tags: [首装向导]
      summary: 装好了没有
      description: 向导问的第一个问题：实例配置好了吗。装好了它就关门。
      responses:
        '200':
          description: 当前状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: { type: boolean }
                  has_admin: { type: boolean }
                  has_tenants: { type: boolean }

  /api/init/env-preview:
    get:
      tags: [首装向导]
      summary: 看看环境变量
      description: 向导第三页要给运维看一眼这个实例会读到什么。密钥本身不返回，只有「是不是占位串」。
      responses:
        '200':
          description: 环境变量预览
          content:
            application/json:
              schema:
                type: object
                properties:
                  env:
                    type: object
                    additionalProperties: { type: string }

  /api/init/database:
    post:
      tags: [首装向导]
      summary: 建库建表
      description: 连上数据库，把 schema 建出来。幂等：重复调用不会重建已有的东西。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [db_host, db_user, db_password, db_name]
              properties:
                db_host: { type: string, example: 127.0.0.1 }
                db_port: { type: integer, example: 3306 }
                db_user: { type: string, example: root }
                db_password: { type: string }
                db_name: { type: string, example: digital_management }
      responses:
        '200':
          description: schema 就绪
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/init/admin:
    post:
      tags: [首装向导]
      summary: 建第一个管理员
      description: 建平台管理员和它的第一个租户。密码由这里定，只在这一刻出现。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: admin }
                password: { type: string, format: password }
                email: { type: string, format: email }
                tenant_name: { type: string, example: 默认租户 }
      responses:
        '201':
          description: 建好了
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  tenant_id: { type: string }
                  admin:
                    type: object
                    properties:
                      created: { type: boolean }
                      username: { type: string }
                      password: { type: string, description: 只有这一次会返回 }
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/init/seed:
    post:
      tags: [首装向导]
      summary: 灌一批示例资产
      description: 装一套示例图，方便看看界面长什么样。空库才需要。
      responses:
        '200':
          description: 灌了多少
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
                  skipped: { type: boolean }

  # ---------------------------------------------------------------- 认证 ----
  /api/v1/auth/login:
    post:
      tags: [认证]
      summary: 租户门登录
      description: |
        用租户里的账号与密码换一对令牌。

        平台管理员**不能**走这扇门：它会答 403 并说明原因——平台管理员要走的
        是平台门。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
                tenant: { type: string, description: 租户 id 或 slug }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/auth/platform-login:
    post:
      tags: [认证]
      summary: 平台门登录
      description: |
        平台管理员从这里进门。它不属于任何租户——登录之后，平台管理员可以用
        `X-Tenant` 头选择要操作哪个租户。

        租户账号走这扇门会答 403。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/auth/refresh:
    post:
      tags: [认证]
      summary: 换一对新令牌
      description: 用刷新令牌换新的访问令牌与刷新令牌。旧的刷新令牌用完就作废。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: 换好了
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      tags: [认证]
      summary: 登出
      description: 作废这个会话。已经签出去的访问令牌还在有效期内——服务端不记黑名单。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 登出了
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/me:
    get:
      tags: [认证]
      summary: 我是谁
      description: 当前令牌是谁的，以及它属于哪个租户。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 当前的账号
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/tenants:
    get:
      tags: [认证]
      summary: 可以选的租户
      description: |
        登录页上那个下拉框的来源。租户账号只会看到自己那一个；平台管理员会
        看到全部。
      responses:
        '200':
          description: 租户列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tenant' }

  /api/v1/auth/change-password:
    post:
      tags: [认证]
      summary: 改自己的密码
      description: 要给旧密码。改完现有会话仍然有效。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password: { type: string, format: password }
                new_password: { type: string, format: password }
      responses:
        '200':
          description: 改好了
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------- 资产 ----
  /api/v1/assets:
    get:
      tags: [资产]
      summary: 资产列表
      description: 租户自己的资产。默认不含回收站里的。
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          description: 状态过滤。`deleted` 看回收站。
          schema: { type: string, enum: [ready, processing, deleted] }
        - name: keyword
          in: query
          description: 按标题或文件名搜
          schema: { type: string }
        - name: category_id
          in: query
          schema: { type: string }
        - name: include_deleted
          in: query
          description: 带上回收站里的
          schema: { type: boolean }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: 一页资产
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetPage' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/assets/upload:
    post:
      tags: [资产]
      summary: 上传文件
      description: |
        multipart 上传。字段名是 **`files`**（复数），一次可以带多个文件。

        同一个文件按内容去重：同样的字节再传一次，回来的是同一个资产。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
                title: { type: string }
                description: { type: string }
                category_id: { type: string }
                tag_names: { type: string, description: 逗号分隔 }
      responses:
        '200':
          description: 存好了
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Asset' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/assets/{id}:
    get:
      tags: [资产]
      summary: 资产详情
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: 这个资产
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [资产]
      summary: 改标题、描述和标签
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                category_id: { type: string }
                tag_names: { type: string, description: 逗号分隔 }
      responses:
        '200':
          description: 改好了
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [资产]
      summary: 删除资产
      description: |
        默认是**软删除**：行移到回收站，`GET /assets?status=deleted` 能看到。

        `?permanent=true` 是彻底删除，数据和文件一起消失。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - name: permanent
          in: query
          description: 彻底删除，不可逆
          schema: { type: boolean }
      responses:
        '200':
          description: 删掉了
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  permanent: { type: boolean }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/assets/{id}/manifest:
    get:
      tags: [资产]
      summary: 资产的清单
      description: 这个资产的原图、缩略图与元数据，以及一张对外的签名链接。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: 清单
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetManifest' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/assets/{id}/download:
    post:
      tags: [资产]
      summary: 要一张下载票
      description: |
        换一张带签名的下载链接。浏览器不能给 `<img src>` 带 Authorization
        头，所以文件走签名链接——签名覆盖这个资产的租户，它只打开签发时的那一个文件。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: 下载票
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DownloadTicket' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/assets/{id}/restore:
    post:
      tags: [资产]
      summary: 从回收站里捡回来
      description: 只对回收站里的资产有效；别的资产会答 400。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: 捡回来了
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/assets/import-url:
    post:
      tags: [集成]
      summary: 从一个网址导入
      description: |
        服务器自己去把那个文件抓回来。

        目标地址默认**不许指向内网**（10.x、172.16-31.x、192.168.x、127.0.0.1、
        169.254.x 等）——那台服务器自己够得着的地址，不该由一个外部请求指出来。
        接收方确实在你自己的网络里时，运维得把 `WEBHOOK_ALLOW_PRIVATE_TARGETS`
        设成 `1`。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
                title: { type: string }
                tag_names: { type: string }
      responses:
        '200':
          description: 导进来了
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/assets/from-comfyui/{job_id}:
    post:
      tags: [集成]
      summary: 认领一个 ComfyUI 任务
      description: |
        ComfyUI 那边跑完了，把 `job_id` 报过来，这里给它登记成一个资产。

        任务还没产出文件时，这里先登记一个**占位资产**：清单指向一个占位文件，
        真正的图产出之后再登记一次。
      security: [{ bearerAuth: [] }]
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                prompt: { type: string }
                seed: { type: integer }
                model_name: { type: string }
                metadata: { type: object, additionalProperties: true }
      responses:
        '200':
          description: 登记好了
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------- 分类与标签 ----
  /api/v1/categories:
    get:
      tags: [分类与标签]
      summary: 分类树
      description: 租户自己的分类，按排序号排好。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 分类列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [分类与标签]
      summary: 建一个分类
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                parent_id: { type: string, description: 父分类；不给就是根分类 }
                description: { type: string }
                sort_order: { type: integer }
      responses:
        '201':
          description: 建好了
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/categories/{id}:
    put:
      tags: [分类与标签]
      summary: 改分类
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                parent_id: { type: string }
                description: { type: string }
                sort_order: { type: integer }
      responses:
        '200':
          description: 改好了
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [分类与标签]
      summary: 删分类
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 删掉了
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/tags:
    get:
      tags: [分类与标签]
      summary: 标签列表
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 标签列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tag' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [分类与标签]
      summary: 建一个标签
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                color: { type: string, example: '#fa8c16' }
      responses:
        '201':
          description: 建好了
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/tags/{id}:
