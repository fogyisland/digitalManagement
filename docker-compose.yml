# Two services: MySQL for the data, the Node application for everything else.
#
# The application serves the API, the uploaded files and the built frontend
# from one port, so the only other thing that has to run is the database.

services:
  mysql:
    image: mysql:8.0
    container_name: dam-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass_change_me
      MYSQL_DATABASE: digital_management
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot_pass_change_me"]
      interval: 10s
      timeout: 5s
      retries: 10

  dam:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dam
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: "8000"
      HOST: "0.0.0.0"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: root_pass_change_me
      DB_NAME: digital_management
      # Change this before exposing the container to anything but localhost.
      JWT_SECRET: please-change-me-in-production-32chars-minimum
      SEED_SAMPLE_ASSETS: "0"
    ports:
      - "8000:8000"
    volumes:
      - dam_storage:/app/storage
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  mysql_data:
  dam_storage:
