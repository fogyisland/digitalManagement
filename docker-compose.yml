# Single-container deployment.
#
# The Node backend serves the API, the uploaded files and the built frontend
# from one port, so there is nothing else to run — the MySQL service of the
# previous architecture is gone; the data lives in a SQLite file on a volume.

services:
  dam:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dam
    restart: unless-stopped
    environment:
      PORT: "8000"
      HOST: "0.0.0.0"
      DB_PATH: /app/backend/data/dam.db
      STORAGE_DIR: /app/backend/storage
      # Change this before exposing the container to anything but localhost.
      JWT_SECRET: please-change-me-in-production-32chars-minimum
      SEED_SAMPLE_ASSETS: "1"
    ports:
      - "8000:8000"
    volumes:
      - dam_data:/app/backend/data
      - dam_storage:/app/backend/storage
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  dam_data:
  dam_storage:
